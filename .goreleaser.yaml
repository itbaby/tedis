version: 2

project_name: tedis

builds:
  - id: tedis
    main: ./cmd/tedis
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: tedis
    repository:
      owner: itbaby
      name: homebrew-tedis
    homepage: "https://github.com/itbaby/tedis"
    description: "Keyboard-driven Redis TUI: tree browser, live value inspector, query console"
    commit_author:
      name: itbaby
      email: itbaby@users.noreply.github.com

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore"]
